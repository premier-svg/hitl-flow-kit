name: Feature request
description: Suggest a safe improvement to the workflow kit.
title: "[Feature]: "
labels: ["help wanted"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What workflow problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep examples public-safe and credential-free.
    validations:
      required: true
